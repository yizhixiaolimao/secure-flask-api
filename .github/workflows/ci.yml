name: Secure API CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-sast:
    name: Tests and Bandit SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Create report directory
        run: mkdir -p reports

      - name: Run Bandit SAST
        run: bandit -r app -f html -o reports/bandit-report.html

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-sast-report
          path: reports/bandit-report.html
          if-no-files-found: warn
          retention-days: 14

  sca:
    name: Dependency vulnerability scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python SCA tool
        run: python -m pip install pip-audit==2.10.1

      - name: Create report directory
        run: mkdir -p reports/pip-audit reports/dependency-check

      - name: Run pip-audit
        id: pip_audit
        continue-on-error: true
        run: >-
          pip-audit -r requirements.txt
          --format=json
          --output=reports/pip-audit/pip-audit.json

      - name: Run OWASP Dependency-Check
        id: dependency_check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: secure-flask-api
          path: .
          format: HTML
          out: reports/dependency-check
          args: >-
            --enableExperimental
            --failOnCVSS 7

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sca-reports
          path: |
            reports/pip-audit/
            reports/dependency-check/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce SCA results
        if: always()
        env:
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          DEPENDENCY_CHECK_OUTCOME: ${{ steps.dependency_check.outcome }}
        run: |
          if [ "$PIP_AUDIT_OUTCOME" != "success" ] || [ "$DEPENDENCY_CHECK_OUTCOME" != "success" ]; then
            echo "At least one SCA scanner failed or found a vulnerability above its threshold."
            exit 1
          fi

